<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>購入完了 - Suguraku</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        background: #f7f9fc;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: #333;
      }

      .card {
        background: white;
        padding: 40px 50px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        text-align: center;
        max-width: 420px;
      }

      h1 {
        font-size: 26px;
        margin-bottom: 12px;
      }

      p {
        font-size: 16px;
        margin-bottom: 24px;
        line-height: 1.6;
      }

      .btn {
        display: inline-block;
        padding: 12px 24px;
        background: #4a90e2;
        color: white;
        border-radius: 8px;
        text-decoration: none;
        font-size: 16px;
        transition: 0.2s;
      }

      .btn:hover {
        background: #3b7ac2;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>購入が完了しました 🎉</h1>
      <p>お支払いありがとうございます。<br />処理が正常に完了しました。</p>
      <a class="btn" href="/buy.html">続けて購入する</a>
    </div>
  </body>
</html>
