body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.container {
  background: white;
  border-radius: 16px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  max-width: 450px;
  width: 100%;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  padding: 40px 30px;
  text-align: center;
}

.header h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

.header p {
  opacity: 0.9;
  font-size: 14px;
}

.content {
  padding: 40px 30px;
}

.product-card {
  border: 2px solid #e0e0e0;
  border-radius: 12px;
  padding: 25px;
  margin-bottom: 30px;
  transition: all 0.3s ease;
}

.product-card:hover {
  border-color: #667eea;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
}

.product-name {
  font-size: 20px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
}

.product-description {
  color: #666;
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.price {
  font-size: 32px;
  font-weight: 700;
  color: #667eea;
  display: flex;
  align-items: baseline;
  gap: 5px;
}

.price-currency {
  font-size: 20px;
  font-weight: 500;
}

.buy-button {
  width: 100%;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  border: none;
  padding: 18px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
}

.buy-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
}

.buy-button:active {
  transform: translateY(0);
}

.buy-button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.security-badge {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 20px;
  color: #999;
  font-size: 13px;
}

.security-badge svg {
  width: 16px;
  height: 16px;
}

.loading {
  display: none;
  text-align: center;
  margin-top: 20px;
  color: #667eea;
  font-size: 14px;
}

.loading.active {
  display: block;
}

.error-message {
  display: none;
  background: #fee;
  border: 1px solid #fcc;
  color: #c33;
  padding: 15px;
  border-radius: 8px;
  margin-top: 20px;
  font-size: 14px;
}

.error-message.active {
  display: block;
}

  </div>

  <script>
    const button = document.getElementById('checkout-button');
    const loading = document.getElementById('loading');
    const errorMessage = document.getElementById('error-message');

    button.addEventListener('click', async () => {
      // ボタンを無効化
      button.disabled = true;
      button.textContent = '処理中...';
      loading.classList.add('active');
      errorMessage.classList.remove('active');

      try {
        // API を呼び出し
        const response = await fetch('/api/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'エラーが発生しました');
        }

        // Stripe チェックアウトページへリダイレクト
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error('チェックアウトURLが取得できませんでした');
        }

      } catch (error) {
        console.error('Error:', error);
        errorMessage.textContent = `エラー: ${error.message}`;
        errorMessage.classList.add('active');
        button.disabled = false;
        button.textContent = '今すぐ購入する';
        loading.classList.remove('active');
      }
    });
  </script>
<script>
document.getElementById("checkout-button").addEventListener("click", async () => {
  // ローディング表示（任意）
  const loading = document.getElementById("loading");
  if (loading) loading.style.display = "block";

  // Stripe 決済APIを呼び出す
  const response = await fetch("/api/checkout", {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });

  const data = await response.json();

  if (data.url) {
    // Stripe の決済ページへ移動
    window.location.href = data.url;
  } else {
    alert("決済ページの生成に失敗しました。");
  }
});
</script>
