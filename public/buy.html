<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suguraku - 購入ページ</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #0051bb; }
        .info { margin-top: 20px; color: #666; }
    </style>
</head>
<body>
    <h1>🎟️ Suguraku 待ち時間短縮チケット</h1>
    <p id="facility-info">施設ID: 読み込み中...</p>
    <p class="info">※このチケットはダイナミックプライシング（時間帯により価格変動）が適用されています。</p>
    <button id="buy-button">今すぐ購入する</button>

    <!-- ★★★ ここから下の <script> タグ内が、新しいコードです ★★★ -->
    <script>
        // 1. URLから施設IDを取得 (例: ?facility=store-a の "store-a" 部分)
        const urlParams = new URLSearchParams(window.location.search);
        const facilityId = urlParams.get('facility') || 'default'; // 指定がなければ'default'を使う
        
        // 画面上に施設IDを表示（確認用）
        document.getElementById('facility-info').textContent = `施設ID: ${facilityId}`;

        // 2. 「購入する」ボタンが押された時のメイン関数
        async function handlePurchase() {
            const buyButton = document.getElementById('buy-button');
            
            // ボタンを一時的に無効化し、「処理中...」と表示（二重クリック防止）
            buyButton.disabled = true;
            buyButton.textContent = '処理中...';

            try {
                console.log('Sending facilityId to server:', facilityId);
                
                // 3. バックエンド(/api/checkout)に施設IDを送信
                const response = await fetch('/api/checkout', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        facility: facilityId, // ← ここで施設IDを送っています！
                    }),
                });

                const data = await response.json();
                console.log('Response from server:', data);
                
                // 4. Stripeの決済ページへリダイレクト
                if (data.url) {
                    window.location.href = data.url;
                } else {
                    alert('決済ページの作成に失敗しました。もう一度お試しください。');
                    throw new Error('No URL in response');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('エラーが発生しました。コンソールをご確認ください。');
            } finally {
                // エラーが起きてもボタンは元に戻す
                buyButton.disabled = false;
                buyButton.textContent = '今すぐ購入する';
            }
        }

        // 5. ページ上のボタンに関数を紐づける
        document.getElementById('buy-button').addEventListener('click', handlePurchase);
    </script>
    <!-- ★★★ ここまでが、新しいコードです ★★★ -->
</body>
</html>
