<!DOCTYPE html>
<html>
  <body>
    <h1>購入ページ</h1>
    <button id="checkoutBtn">購入する</button>

    <script>
      const API_BASE = "https://suguraku-web.vercel.app/api";

      document.getElementById("checkoutBtn").onclick = async () => {
        const res = await fetch(`${API_BASE}/checkout`, {
          method: "POST",
        });
        const data = await res.json();
        window.location.href = data.url;
      };
    </script>
  </body>
</html>
